name: Trial 3 NIFTY 500 Scanner

on:
  workflow_dispatch:
  schedule:
    # 17:00 IST = 11:30 UTC, Monday to Friday
    - cron: "30 11 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests openpyxl

      - name: Run Trial 3 scanner
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python trial3_nifty500_scanner.py

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: trial3-qualifying-stocks
          path: |
            trial3_qualifying_stocks.xlsx
            trial3_qualifying_stocks.csv
          if-no-files-found: error
          retention-days: 30
