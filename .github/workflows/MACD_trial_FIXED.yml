name: Trial 1 - NIFTY 500 10Y Scanner

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install pandas numpy yfinance openpyxl

      - name: Run historical scanner
        run: |
          python MACD_trial_FIXED.py

      - name: Email Excel
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Trial 1 - NIFTY 500 10-Year Historical Signals"
          to: ${{ secrets.GMAIL_TO }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: |
            NIFTY 500 10-year historical scanner completed.

            UNIVERSE:
            Point-in-time NIFTY 500 membership on the exact signal date.

            MONTHLY:
            RSI(5) > SMA(14)
            ADX(14) > previous month's ADX(14)
            Current ADX - previous ADX is greater than 0 and less than 1.

            DAILY:
            Supertrend(10,1) GREEN
            Low <= EMA20 and Close > EMA20 (touch EMA20 and close above it)
            RSI(5) > SMA14
            MACD(12,26,9): blue MACD line > red signal line

            The Excel contains Date + Stock and supporting
            indicator values, plus Rules and Data Errors.
          attachments: trial_1_nifty500_10yr_signals.xlsx
