name: NIFTY 500 6-Condition Excel Stocklist

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install pandas numpy requests yfinance openpyxl

      - name: Run 10-year historical scan
        run: python Nifty500_6Condition_RSI_Supertrend_10Y_Excel.py

      - name: Email Excel result
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USERNAME }}
          to: ${{ secrets.GMAIL_TO }}
          subject: NIFTY 500 10-Year 6-Condition Stock List
          body: |
            Attached is the NIFTY 500 historical date-wise qualifying stock list.

            Period: last 10 years.
            Universe: point-in-time NIFTY 500 membership.
            RSI(5) must touch 30 or below, then within 0-7 trading days RSI(5) must cross above its SMA(14) and Supertrend(10,1) must be GREEN. These two events do not need to occur on the same day.

            The original 5 RSI/ADX criteria remain mandatory.
          attachments: nifty500_6condition_datewise.xlsx
