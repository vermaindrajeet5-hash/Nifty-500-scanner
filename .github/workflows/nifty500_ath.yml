name: NIFTY 500 All-Time High Daily Scan

on:
  schedule:
    - cron: "0 11 * * 1-5"

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run NIFTY 500 ATH scanner
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python Nifty500_All_Time_High.py

      - name: Check output files
        run: |
          echo "Checking ATH output files..."

          if [ -f "nifty500_all_time_high.csv" ]; then
            echo "FULL ATH CSV FOUND"
            ls -lh nifty500_all_time_high.csv
            echo ""
            echo "First 20 rows:"
            head -20 nifty500_all_time_high.csv
          else
            echo "FULL ATH CSV NOT FOUND"
            exit 1
          fi

          if [ -f "nifty500_at_or_near_ath.csv" ]; then
            echo ""
            echo "NEAR ATH CSV FOUND"
            ls -lh nifty500_at_or_near_ath.csv
            echo ""
            echo "Near ATH stocks:"
            cat nifty500_at_or_near_ath.csv
          else
            echo "NEAR ATH CSV NOT FOUND"
            exit 1
          fi

      - name: Upload ATH reports
        uses: actions/upload-artifact@v4
        with:
          name: nifty500-all-time-high-reports
          path: |
            nifty500_all_time_high.csv
            nifty500_at_or_near_ath.csv
            nifty500_ath_errors.csv
          if-no-files-found: warn
