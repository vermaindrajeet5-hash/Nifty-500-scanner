name: SUP TRIAL - NIFTY 500 Historical Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl

      - name: Run SUP TRIAL
        run: |
          python sup_trial.py

      - name: Email Excel result
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "SUP TRIAL - NIFTY 500 Historical Stock Signals"
          to: ${{ secrets.GMAIL_TO }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: |
            SUP TRIAL historical scan completed.

            Rule:
            Daily RSI(5) < 31, then check the previous completed monthly candle.
            Signal only when that previous month's Monthly Supertrend(10,1) was GREEN.

            The attached Excel file contains the date-wise stock signals.
          attachments: sup_trial_results.xlsx
