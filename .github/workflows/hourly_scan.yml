name: Nifty 500 Hourly Scanner

on:
  workflow_dispatch:

  schedule:
    # 10:15 AM IST
    - cron: "45 4 * * 1-5"

    # 11:15 AM IST
    - cron: "45 5 * * 1-5"

    # 12:15 PM IST
    - cron: "45 6 * * 1-5"

    # 1:15 PM IST
    - cron: "45 7 * * 1-5"

    # 2:15 PM IST
    - cron: "45 8 * * 1-5"

    # 3:15 PM IST
    - cron: "45 9 * * 1-5"


jobs:
  scan:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # PYTHON
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ------------------------------------------------------
      # DEPENDENCIES
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # CHECK GMAIL SETTINGS
      # ------------------------------------------------------

      - name: Check Gmail settings
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}

        run: |
          if [ -n "$GMAIL_USERNAME" ]; then
            echo "GMAIL_USERNAME: FOUND"
          else
            echo "GMAIL_USERNAME: MISSING"
            exit 1
          fi

          if [ -n "$GMAIL_APP_PASSWORD" ]; then
            echo "GMAIL_APP_PASSWORD: FOUND"
          else
            echo "GMAIL_APP_PASSWORD: MISSING"
            exit 1
          fi

          if [ -n "$GMAIL_TO" ]; then
            echo "GMAIL_TO: FOUND"
          else
            echo "GMAIL_TO: MISSING"
            exit 1
          fi


      # ------------------------------------------------------
      # RUN SCANNER
      # ------------------------------------------------------

      - name: Run Nifty 500 hourly scanner
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}

        run: |
          python Hourly_Scanner.py
