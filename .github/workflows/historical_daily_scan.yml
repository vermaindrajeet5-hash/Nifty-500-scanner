name: Historical Daily Signals

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run historical daily scan
        run: |
          python Daily_Historical_Signals.py

      - name: Upload historical signals
        uses: actions/upload-artifact@v4
        with:
          name: daily-historical-signals
          path: daily_historical_signals.csv
