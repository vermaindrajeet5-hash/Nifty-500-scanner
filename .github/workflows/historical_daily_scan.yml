name: Historical Daily PIT Signals

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance requests

      - name: Run historical scanner
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          python Daily_Historical_PIT_Signals.py

      - name: Check output file
        run: |
          echo "Checking CSV file..."

          if [ -f "daily_historical_pit_signals.csv" ]; then
            echo "CSV FOUND"
            ls -lh daily_historical_pit_signals.csv
            echo ""
            echo "First 20 rows:"
            head -20 daily_historical_pit_signals.csv
          else
            echo "CSV NOT FOUND"
            exit 1
          fi

      - name: Upload historical signals
        uses: actions/upload-artifact@v4
        with:
          name: daily-historical-pit-signals
          path: daily_historical_pit_signals.csv
