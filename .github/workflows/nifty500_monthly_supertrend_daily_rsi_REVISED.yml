name: NIFTY 500 Monthly Supertrend Daily RSI Historical Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy yfinance openpyxl

      - name: Run 10-year scan
        run: python bot.py

      - name: Email Excel result
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: ${{ secrets.GMAIL_USERNAME }}
          to: ${{ secrets.GMAIL_TO }}
          subject: 'NIFTY 500 10-Year Monthly Supertrend + Daily RSI Stock List'
          body: |
            10-year historical NIFTY 500 scan completed.

            Criteria:
            - Point-in-time NIFTY 500 membership
            - Monthly Supertrend (10,1) turns GREEN
            - After the monthly GREEN state is known, Daily RSI(5) goes below 31
            - No 0-7 day restriction
            - No profitability/backtest

            The attached Excel file contains the qualifying stock and date details.
          attachments: nifty500_monthly_supertrend_daily_rsi_history.xlsx
