name: NIFTY 500 Historical - Within 15% of ATH

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance openpyxl

      - name: Run historical scan
        run: |
          python nifty500_15pct_ath_historical.py

      - name: Email Excel result
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "NIFTY 500 Historical - Stocks Within 15% of ATH"
          to: ${{ secrets.GMAIL_TO }}
          from: ${{ secrets.GMAIL_USERNAME }}
          body: |
            Historical NIFTY 500 daily ATH scan completed.

            Rule:
            A stock is listed when its DAILY HIGH reaches at least 85% of
            its all-time-high price known up to that historical date.

            The stock must have actually been a NIFTY 500 constituent on
            that exact historical date.

            No future prices are used to calculate an earlier ATH.

            The attached Excel contains the date-wise historical list.
          attachments: nifty500_15pct_ath_historical.xlsx
